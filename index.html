<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Admission Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="form-header">
            <h1>Student Admission Form</h1>
            <p>Please fill in all the required details</p>
        </div>

        <form>

            <!-- Personal Information -->
            <fieldset>

                <legend>Personal Information</legend>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="firstName">
                            First Name
                        </label>

                        <input type="text"
                               id="firstName"
                               name="firstName"
                               placeholder="Enter first name"
                               required>
                    </div>


                    <div class="form-group">
                        <label for="lastName">
                            Last Name
                        </label>

                        <input type="text"
                               id="lastName"
                               name="lastName"
                               placeholder="Enter last name"
                               required>
                    </div>


                    <div class="form-group">
                        <label for="dob">
                            Date of Birth
                        </label>

                        <input type="date"
                               id="dob"
                               name="dob"
                               required>
                    </div>


                    <div class="form-group">
                        <label>Gender</label>

                        <div class="radio-group">

                            <label>
                                <input type="radio"
                                       name="gender"
                                       value="male">
                                Male
                            </label>

                            <label>
                                <input type="radio"
                                       name="gender"
                                       value="female">
                                Female
                            </label>

                            <label>
                                <input type="radio"
                                       name="gender"
                                       value="other">
                                Other
                            </label>

                        </div>
                    </div>

                </div>

            </fieldset>


            <!-- Contact Information -->
            <fieldset>

                <legend>Contact Information</legend>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="email">
                            Email Address
                        </label>

                        <input type="email"
                               id="email"
                               name="email"
                               placeholder="student@example.com"
                               required>
                    </div>


                    <div class="form-group">
                        <label for="phone">
                            Phone Number
                        </label>

                        <input type="tel"
                               id="phone"
                               name="phone"
                               placeholder="Enter phone number"
                               required>
                    </div>


                    <div class="form-group full-width">
                        <label for="address">
                            Address
                        </label>

                        <textarea id="address"
                                  name="address"
                                  rows="3"
                                  placeholder="Enter complete address"
                                  required></textarea>
                    </div>


                    <div class="form-group">
                        <label for="city">
                            City
                        </label>

                        <input type="text"
                               id="city"
                               name="city"
                               placeholder="Enter city"
                               required>
                    </div>


                    <div class="form-group">
                        <label for="pincode">
                            PIN Code
                        </label>

                        <input type="text"
                               id="pincode"
                               name="pincode"
                               placeholder="Enter PIN code"
                               required>
                    </div>

                </div>

            </fieldset>


            <!-- Academic Information -->
            <fieldset>

                <legend>Academic Information</legend>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="qualification">
                            Previous Qualification
                        </label>

                        <select id="qualification"
                                name="qualification"
                                required>

                            <option value="">
                                Select Qualification
                            </option>

                            <option value="10th">
                                10th
                            </option>

                            <option value="12th">
                                12th
                            </option>

                            <option value="diploma">
                                Diploma
                            </option>

                            <option value="degree">
                                Degree
                            </option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label for="percentage">
                            Percentage / CGPA
                        </label>

                        <input type="text"
                               id="percentage"
                               name="percentage"
                               placeholder="Enter percentage or CGPA"
                               required>
                    </div>


                    <div class="form-group">
                        <label for="course">
                            Course Applying For
                        </label>

                        <select id="course"
                                name="course"
                                required>

                            <option value="">
                                Select Course
                            </option>

                            <option value="cse">
                                Computer Science Engineering
                            </option>

                            <option value="ece">
                                Electronics & Communication
                            </option>

                            <option value="eee">
                                Electrical Engineering
                            </option>

                            <option value="mech">
                                Mechanical Engineering
                            </option>

                            <option value="civil">
                                Civil Engineering
                            </option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label for="year">
                            Admission Year
                        </label>

                        <select id="year"
                                name="year"
                                required>

                            <option value="">
                                Select Year
                            </option>

                            <option value="2026">
                                2026
                            </option>

                            <option value="2027">
                                2027
                            </option>

                            <option value="2028">
                                2028
                            </option>

                        </select>
                    </div>

                </div>

            </fieldset>


            <!-- Parent / Guardian Information -->
            <fieldset>

                <legend>Parent / Guardian Information</legend>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="parentName">
                            Parent / Guardian Name
                        </label>

                        <input type="text"
                               id="parentName"
                               name="parentName"
                               placeholder="Enter name"
                               required>
                    </div>


                    <div class="form-group">
                        <label for="parentPhone">
                            Parent Phone Number
                        </label>

                        <input type="tel"
                               id="parentPhone"
                               name="parentPhone"
                               placeholder="Enter phone number"
                               required>
                    </div>

                </div>

            </fieldset>


            <!-- Declaration -->
            <div class="declaration">

                <label>
                    <input type="checkbox"
                           required>

                    I confirm that the information provided
                    above is correct and complete.
                </label>

            </div>


            <!-- Buttons -->
            <div class="button-group">

                <button type="reset"
                        class="reset-btn">
                    Reset
                </button>

                <button type="submit"
                        class="submit-btn">
                    Submit Application
                </button>

            </div>

        </form>

    </div>

</body>

</html>
